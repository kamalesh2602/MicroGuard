[project]
name = "microguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kamalesh2602", email = "kamaleshg2602@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiobreaker>=1.2.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
microguard = "microguard:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "locust>=2.46.7",
]
